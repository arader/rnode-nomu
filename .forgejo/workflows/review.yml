name: Review

# Reviews an open pull request on demand (Actions → Review → Run workflow): a pull request from a
# fork, or opened with AGit, which the PR workflow's agents skip because Forgejo gives those runs
# no secrets, or a re-review. It sets the same agent-actions/* statuses as the PR workflow on the
# pull request's head, so it also unblocks main's required checks. Check changes under .forgejo/
# in a fork's pull request before merging it: its PR / … job statuses come from the fork's copy
# of the workflows.
#
# The reviewers use remote infra/agent-actions releases (@v0); checkout uses @v4. These tags move
# within their major version and are not immutable commit pins. To pin a version, use @vX.Y.Z or a
# commit SHA. Dispatch from a trusted branch so the workflow runs upstream action code, not code
# from the pull request. The PR checkout is only read, never executed. Settings as for pr.yml.

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number
        required: true
        type: string
      dry-run:
        description: Print the reviews instead of posting them
        type: boolean
        default: false

concurrency:
  group: review-${{ inputs.pr-number }}
  cancel-in-progress: true

jobs:
  pr-agent:
    runs-on: copilot-agent
    timeout-minutes: 30
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
          ref: refs/pull/${{ inputs.pr-number }}/head
      - uses: https://forgejo.example/infra/agent-actions/pr-agent@v0
        with:
          copilot-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          # Optional: post as the pr-agent account instead of forgejo-actions
          # (docs/permissions-and-blocking.md in agent-actions).
          comment-token: ${{ secrets.PR_AGENT_FORGEJO_TOKEN }}
          bot-login: ${{ vars.PR_AGENT_LOGIN }}
          pr-number: ${{ inputs.pr-number }}
          dry-run: ${{ inputs.dry-run }}
          fail-on: ${{ vars.AGENT_FAIL_ON || 'high' }}
          model: ${{ vars.AGENT_MODEL }}
          models: ${{ vars.AGENT_MODELS }}

  security-agent:
    runs-on: copilot-agent
    timeout-minutes: 30
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
          ref: refs/pull/${{ inputs.pr-number }}/head
      - uses: https://forgejo.example/infra/agent-actions/security-agent@v0
        with:
          copilot-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          # Optional: post as the security-agent account instead of forgejo-actions
          # (docs/permissions-and-blocking.md in agent-actions).
          comment-token: ${{ secrets.SECURITY_AGENT_FORGEJO_TOKEN }}
          bot-login: ${{ vars.SECURITY_AGENT_LOGIN }}
          mode: pr
          pr-number: ${{ inputs.pr-number }}
          dry-run: ${{ inputs.dry-run }}
          fail-on: ${{ vars.AGENT_FAIL_ON || 'high' }}
          model: ${{ vars.AGENT_MODEL }}
          models: ${{ vars.AGENT_MODELS }}

  qa-agent:
    runs-on: copilot-agent
    timeout-minutes: 30
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
          ref: refs/pull/${{ inputs.pr-number }}/head
      - uses: https://forgejo.example/infra/agent-actions/qa-agent@v0
        with:
          copilot-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          # Optional: post as the qa-agent account instead of forgejo-actions
          # (docs/permissions-and-blocking.md in agent-actions).
          comment-token: ${{ secrets.QA_AGENT_FORGEJO_TOKEN }}
          bot-login: ${{ vars.QA_AGENT_LOGIN }}
          pr-number: ${{ inputs.pr-number }}
          dry-run: ${{ inputs.dry-run }}
          fail-on: ${{ vars.AGENT_FAIL_ON || 'high' }}
          model: ${{ vars.AGENT_MODEL }}
          models: ${{ vars.AGENT_MODELS }}
