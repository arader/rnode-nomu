# Generic rnode-linux configuration.
# For simulation set radio.driver = "sim" and omit [spi]/[gpio].

[spi]
device = "/dev/spidev0.0"
speed_hz = 8_000_000

[gpio]
# May be a chip name ("gpiochip0"), device path ("/dev/gpiochip0"), or chip label.
chip = "gpiochip0"
# Optional switched radio power rail enable line.
# power = 16
power_on_delay_ms = 100
# Switch the rail off on exit, after driving reset, rxen and txen low. The default, false, leaves
# the rail on and the lines as they are, so a restart does not power-cycle the modem.
power_off_on_exit = false
reset = 17
busy = 27
dio1 = 22
# rxen = 23
# TX-enable line of a PA module or RF switch: high while transmitting, never with rxen.
# txen = 24

[radio]
driver = "sx1262" # "sx1262" or "sim"
# When true, defer TX while non-LoRa RSSI is >11 dB above the sampled noise floor.
# This can avoid strong interference, but also defers TX during initial floor sampling (~384 ms).
# Applied at startup; a host can switch it with CMD_DIS_IA until the daemon restarts.
avoid_interference = false
# Highest TX power in dBm a host may set: 0 to 22, default 22 (the SX1262 maximum); with
# [radio.pa], 0 to its max_output_dbm, by default that. Higher requests are clamped and the host is
# told the clamped value, so keep Reticulum's txpower at or below it. For regional limits, bench
# tests, or a front end that cannot take full power.
# max_tx_power_dbm = 10

[radio.sx1262]
# DIO3-driven TCXO supply: one of 1.6V, 1.7V, 1.8V, 2.2V, 2.4V, 2.7V, 3.0V, 3.3V.
# Leave unset for modules with a plain crystal.
# tcxo_voltage = "1.8V"
dio2_as_rf_switch = true
ocp = 0x28
# busy_timeout_ms = 100 # default from rnode-sx126x / firmware sx126x::waitOnBusy()
# tx_timeout_ms = 20000 # default from rnode-sx126x / firmware LORA_MODEM_TIMEOUT_MS

# Power amplifier after the SX1262: untested on PA hardware, see README.md "[radio.pa]". The host's
# TX power is then the power after the PA. Without this section the daemon drives a PA as if it were
# the antenna, and the board puts out up to the PA's gain more than hosts ask for.
# [radio.pa]
# "gc1109" or "kct8103l", the Heltec V4's front ends with the firmware's tables, or "custom".
# model = "gc1109"
# custom only: gain in dB at modem outputs of 0, 1, 2, ... dBm; each equal to the one before or
# 1 dB lower.
# gain_db = [12, 12, 12, 11, 11, 10]
# Highest TX power a host may set through the PA: default 28 for gc1109 and kct8103l, required for
# custom; at most the table's highest output.
# max_output_dbm = 28
# Gain of the LNA before the SX1262, subtracted from RSSI: default 17 (gc1109), 21 (kct8103l),
# 0 (custom).
# lna_gain_db = 17

[radio.sim]
air_dir = "target/rnode-air"
node_name = "rnode-linux"
rssi_dbm = -70
snr_db = 7.0
loss = 0.0
crc_error = 0.0

[pty]
# Avoid /tmp for managed deployments; choose a persistent runtime directory.
# A symlink already at this path is replaced; any other file there makes startup fail.
symlink = "target/rnode0"
# Let a host running as another user (e.g. rnsd) open the PTY: hand the slave to a group the
# daemon is a member of (systemd SupplementaryGroups=) and give that group read/write access.
# Avoid modes that open it to every local user, such as "0666".
# group = "dialout"
# mode = "0660"

[storage]
radio_settings = "target/rnode-radio-settings.toml"
# Keep an EEPROM info block that rnodeconf --rom writes and signs with your own key, so that
# rnodeconf validates the device. Until the file exists, the EEPROM is unprovisioned.
# eeprom = "target/rnode-eeprom.bin"

[eeprom]
# Serial number that rnodeconf --info shows. Unset, it is derived from the machine ID
# (/etc/machine-id) and the [pty] symlink path, and stays the same across restarts. No effect
# with storage.eeprom, whose info block has the serial number rnodeconf --rom wrote.
# serial_number = 0x0000002A

[logging]
# RUST_LOG overrides this setting.
log_level = "info"
