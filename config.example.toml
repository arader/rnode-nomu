[spi]
device = "/dev/spidev0.0"
speed_hz = 16_000_000

[gpio]
chip = "gpiochip0"
reset_line = 17
busy_line = 27
dio0_line = 22
# Optional RX-enable pin, set to -1 or omit to disable
# rxen_line = -1

[radio]
# Hardware-specific radio settings (not configurable via KISS)
preamble_symbols = 18
enable_crc = true
enable_tcxo = false
# tcxo_voltage options: "1.6V", "1.7V", "1.8V", "2.2V", "2.4V", "2.7V", "3.0V", "3.3V"
# tcxo_voltage = "3.3V"

# Path to cached radio link config (simulates EEPROM).
# Radio link params (frequency, bandwidth, SF, CR, TX power) are configured
# via KISS commands and persisted here with CMD_CONF_SAVE (0x53).
# If this file exists at startup, the radio auto-configures and goes online.
# If absent, the radio starts offline and waits for KISS configuration.
cache_file = "/var/lib/rnode/radio_cache.toml"

[pty]
# Symlink created pointing to the PTY slave device
symlink = "/tmp/rnode0"

[csma]
enabled = true
slot_min_ms = 24
slot_max_ms = 100
