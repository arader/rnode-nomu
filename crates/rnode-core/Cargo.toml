[package]
name = "rnode-core"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not on crates.io (README.md, "Releases and versions").
publish = false
description = "Hardware-independent RNode logic: KISS host protocol, framing, PHY/CSMA and the node state machine"

[lints]
workspace = true

[features]
sim = []

[dependencies]
log = "0.4"
# MD5 for the EEPROM checksum that rnodeconf verifies (firmware `eeprom_checksum_valid()`).
md-5 = { version = "0.11", default-features = false }

[dev-dependencies]
# The integration tests in tests/ run nodes on the simulated medium, which needs the `sim` feature.
rnode-core = { path = ".", features = ["sim"] }
