[package]
name = "rnode-nomu"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not on crates.io (README.md, "Releases and versions").
publish = false
description = "Linux userspace RNode daemon built on rnode-core"
# Also makes release-plz count README changes as changes to the daemon.
readme = "../../README.md"

[lints]
workspace = true

# The Debian package of the daemon that release builds attach to GitHub releases (cargo-deb;
# README.md, "Installing a release"). Source paths are relative to this directory, except
# target/release/, which cargo-deb resolves to the target directory; the release workflow generates
# THIRD-PARTY-LICENSES.md there before packaging. tests/packaging.rs checks the rest exist.
[package.metadata.deb]
maintainer = "Andrew Rader <537302+arader@users.noreply.github.com>"
license-file = "debian/copyright"
extended-description = """\
rnode-nomu turns a Linux computer with a LoRa modem on its SPI bus into an RNode for Reticulum: \
it drives the modem directly and exposes a pseudo-terminal that speaks the RNode KISS host \
protocol. This package installs the daemon, its systemd unit (neither enabled nor started) and \
example configs in /usr/share/doc/rnode-nomu/examples, and creates the rnode account."""
section = "net"
priority = "optional"
# The sysusers file needs systemd-sysusers, as dh_installsysusers declares.
depends = "$auto, systemd | systemd-standalone-sysusers | systemd-sysusers"
assets = [
    ["target/release/rnode-nomu", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/rnode-nomu/", "644"],
    ["../../NOTICE.md", "usr/share/doc/rnode-nomu/", "644"],
    ["target/release/THIRD-PARTY-LICENSES.md", "usr/share/doc/rnode-nomu/", "644"],
    ["../../config.*.toml", "usr/share/doc/rnode-nomu/examples/", "644"],
]
# debian/ also holds the unit and the sysusers file, which cargo-deb installs with the maintainer
# script fragments of dh_installsystemd and dh_installsysusers. Installing the package neither
# enables nor starts the service, which needs /etc/rnode-nomu.toml first; an upgrade restarts it
# if it is running, and removing the package stops it.
maintainer-scripts = "debian/"
systemd-units = { enable = false, start = false }

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
embedded-hal = "1"
env_logger = "0.11"
log = "0.4"
md-5 = { version = "0.11", default-features = false }
nix = { version = "0.31", features = ["fs", "poll", "signal", "term", "user"] }
rnode-core.workspace = true
rnode-sx126x.workspace = true
rnode-sim.workspace = true
serde = { version = "1", features = ["derive"] }
signal-hook = "0.3"
thiserror = "2"
toml = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
gpiocdev = "0.7"
spidev = "0.6"

[dev-dependencies]
serial_test = "3"
