[package]
name = "rnode-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Linux userspace RNode daemon built on rnode-core"

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
embedded-hal = "1"
env_logger = "0.11"
log = "0.4"
md-5 = { version = "0.11", default-features = false }
nix = { version = "0.31", features = ["fs", "poll", "signal", "term", "user"] }
rnode-core = { path = "../rnode-core" }
rnode-sx126x = { path = "../rnode-sx126x" }
rnode-sim = { path = "../rnode-sim" }
serde = { version = "1", features = ["derive"] }
signal-hook = "0.3"
thiserror = "2"
toml = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
gpiocdev = "0.7"
spidev = "0.6"

[dev-dependencies]
serial_test = "3"
