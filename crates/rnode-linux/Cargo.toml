[package]
name = "rnode-linux"
version.workspace = true
# Still on edition 2021 and outside the workspace lints: this crate is the pre-workspace
# implementation and will be rewritten on top of rnode-core (see issue #24).
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Linux userspace LoRa daemon with KISS protocol interface, targeting SX1262"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
libc = "0.2"
log = "0.4"
nix = { version = "0.31", features = ["ioctl", "poll", "signal", "fs", "term", "process"] }
serde = { version = "1", features = ["derive"] }
spidev = "0.6"
thiserror = "2"
toml = "0.8"
